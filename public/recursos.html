            <section class="front-product">

                    <!-- Mensaje para usuarios no autenticados -->
                    <div id="unauthenticatedMessage" class="alert alert-warning hidden">
                        Debes iniciar sesión para subir archivos.
                    </div>

                    <!-- Formulario para subir archivos (solo para usuarios autenticados) -->
                    <div id="uploadSection" class="hidden">
                        <h2>Subir archivo PDF</h2>
                        <form id="uploadForm">
                            <div class="mb-3">
                                <input type="file" id="fileInput" class="form-control" accept="application/pdf" required>
                            </div>
                            <button type="submit" class="btn custom-btn">Subir</button>
                        </form>
                    </div>

                    <!-- Lista de archivos PDF disponibles -->
                    <div id="filesSection">

                        <ul id="fileList" class="file-list"></ul>
                    </div>
